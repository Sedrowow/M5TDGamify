name: Build Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 1.21). Leave blank to increment the latest version.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            VERSION="${REQUESTED_VERSION}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "Version must use the major.minor format (for example, 1.21)." >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "Tag version must use the major.minor format (for example, v1.21)." >&2
              exit 1
            fi
          else
            latest_major=0
            latest_minor=-1
            while IFS= read -r -d '' file; do
              filename="${file##*/}"
              if [[ "${filename}" =~ ^M5TDG(amify)?\ ([0-9]+)\.([0-9]+)\.bin$ ]]; then
                major=$((10#${BASH_REMATCH[2]}))
                minor=$((10#${BASH_REMATCH[3]}))
                if (( major > latest_major || (major == latest_major && minor > latest_minor) )); then
                  latest_major="${major}"
                  latest_minor="${minor}"
                fi
              fi
            done < <(find "BUILD bins" -maxdepth 1 -type f -name '*.bin' -print0)

            if (( latest_minor < 0 )); then
              VERSION="1.0"
            else
              VERSION="${latest_major}.$((latest_minor + 1))"
            fi
          fi

          if [[ -e "BUILD bins/M5TDGamify ${VERSION}.bin" || -e "BUILD bins/M5TDG ${VERSION}.bin" ]]; then
            echo "Firmware version ${VERSION} already exists in BUILD bins." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Binary version: ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: platformio run --environment m5stack-cardputer

      - name: Copy firmware to BUILD bins
        id: copy_bin
        run: |
          BIN_NAME="M5TDGamify ${{ steps.version.outputs.version }}.bin"
          cp .pio/build/m5stack-cardputer/firmware.bin "BUILD bins/${BIN_NAME}"
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Commit firmware binary
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "BUILD bins/"
          if git diff --cached --quiet; then
            echo "No new binary to commit."
          else
            git commit -m "build: add firmware binary ${{ steps.copy_bin.outputs.bin_name }}"
            git push
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: "BUILD bins/${{ steps.copy_bin.outputs.bin_name }}"
          retention-days: 30
